[project]
name = "sworn-mcp"
version = "0.1.0"
description = "MCP server for Sworn: verified multi-agent research and run debugging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0",
  "httpx>=0.28",
]

[project.scripts]
sworn-mcp = "sworn_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sworn_mcp*"]
