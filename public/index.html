<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trusted Agent Hiring</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ground: #f4f4f0;
    --sheet: #fbfbf8;
    --ink: #111317;
    --ink-2: #474c55;
    --ink-3: #6b7079;
    --rule: #cfd1ca;
    --blue: #1d4bff;
    --blue-wash: #e6ecff;
    --red: #d42a24;
    --gold: #ffc21a;
    --on-ink: #c3c6cc;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --text: "Barlow", system-ui, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 400 17px/1.5 var(--text); font-variant-numeric: tabular-nums;
    caret-color: var(--blue);
  }
  ::selection { background: var(--blue-wash); color: var(--ink); }
  * { scrollbar-color: var(--ink-3) transparent; scrollbar-width: thin; }
  a { color: var(--blue); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  code { font: 500 14px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink-2); }

  /* ---------- control bar ---------- */
  .bar {
    position: sticky; top: 0; z-index: 2; background: var(--ink); color: var(--sheet);
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s5); align-items: center;
    padding: var(--s3) var(--s5);
  }
  .brand { font: 800 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
  form { display: flex; gap: var(--s2); min-width: 0; }
  form input[type=text] {
    flex: 1; min-width: 0; height: 46px; padding: 0 var(--s4);
    border: 2px solid transparent; border-radius: 0; background: var(--sheet); color: var(--ink);
    font: 500 17px/1 var(--text);
  }
  form input[type=text]::placeholder { color: var(--ink-3); }
  form input[type=text]:focus-visible { outline: none; border-color: var(--blue); }
  .run {
    height: 46px; padding: 0 var(--s5); border: 2px solid var(--sheet); border-radius: 0; background: var(--ink); color: var(--sheet);
    font: 800 19px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .run:hover { background: var(--sheet); color: var(--ink); }
  .run:active { transform: translateY(1px); }
  .run:disabled { border-color: var(--ink-3); color: var(--on-ink); background: var(--ink); cursor: progress; }
  .run:focus-visible { outline-color: var(--sheet); }
  /* destructive: isolated, outlined until armed */
  .kill { display: flex; align-items: center; gap: var(--s2); padding-left: var(--s5); border-left: 1px solid #3a3e46; cursor: pointer; user-select: none; }
  .kill input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .kill .box { width: 22px; height: 22px; border: 2px solid var(--red); display: grid; place-items: center; flex: none; transition: background .15s; }
  .kill .box svg { opacity: 0; }
  .kill input:checked + .box { background: var(--red); }
  .kill input:checked + .box svg { opacity: 1; }
  .kill input:focus-visible + .box { outline: 3px solid var(--sheet); outline-offset: 2px; }
  .kill .label { font: 700 16px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: #ff8a84; }
  .kill input:checked ~ .label { color: var(--sheet); }

  /* ---------- page ---------- */
  main { max-width: 1440px; margin: 0 auto; padding: var(--s6) var(--s5) var(--s8); }
  .status { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; color: var(--ink-2); font: 500 16px/1.4 var(--text); margin-bottom: var(--s5); }
  .status b { font: 800 16px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  .phase { background: var(--blue); color: var(--sheet); padding: 5px 10px 4px; font: 800 16px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }

  h2 {
    font: 800 17px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
    margin: var(--s7) 0 var(--s4); padding-bottom: var(--s2); border-bottom: 2px solid var(--ink);
    display: flex; justify-content: space-between; gap: var(--s4); align-items: baseline;
  }
  h2 small { font: 500 16px/1.3 var(--text); letter-spacing: 0; text-transform: none; color: var(--ink-2); }
  .question { font: 800 clamp(30px, 3.6vw, 48px)/1.02 var(--display); text-transform: uppercase; letter-spacing: .005em; margin: 0 0 var(--s5); max-width: 40ch; text-wrap: balance; }
  .question.live { font-size: clamp(24px, 2.4vw, 32px); margin-bottom: var(--s3); max-width: none; }
  .registry.compact { grid-template-columns: auto minmax(0, 1fr); align-items: center; }
  .registry.compact .big { font-size: 32px; }
  .registry.compact .track { grid-column: auto; margin-top: 0; }

  /* answer: the dominant element once a run ends */
  .answer { background: var(--sheet); border-top: 6px solid var(--ink); padding: var(--s5) var(--s6) var(--s6); display: grid; grid-template-columns: minmax(0, 72ch) minmax(200px, 1fr); gap: var(--s6); }
  .answer p { font: 400 21px/1.55 var(--text); margin: 0; text-wrap: pretty; }
  .answer .cite {
    display: inline-block; font: 800 15px/1 var(--display); letter-spacing: .04em; color: var(--sheet); background: var(--blue);
    padding: 3px 6px 2px; margin-left: 2px; vertical-align: 2px; text-decoration: none;
  }
  .answer .cite:hover { background: var(--ink); }
  .credits { border-left: 1px solid var(--rule); padding-left: var(--s5); display: grid; align-content: start; gap: var(--s4); }
  .credits div { display: grid; gap: 2px; }
  .credits dt { font: 700 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .credits dd { margin: 0; font: 800 22px/1.15 var(--display); }
  .answer.stopped, .answer.waiting { grid-template-columns: 1fr; }
  .answer.stopped { border-top-color: var(--red); }
  .answer.stopped p { color: var(--red); font-weight: 600; }
  .answer.waiting p { color: var(--ink-2); }

  /* score line: one typographic line, not tiles */
  .scoreline { margin: 0; padding: var(--s3) 0; border-bottom: 1px solid var(--rule); font: 600 20px/1.4 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  .scoreline b { font-weight: 800; color: var(--ink); }
  .scoreline span + span::before { content: "·"; margin: 0 var(--s3); color: var(--ink-3); }

  /* registry band */
  .registry { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s2) var(--s6); align-items: end; }
  .registry .big { font: 800 clamp(44px, 5vw, 72px)/.9 var(--display); text-transform: uppercase; letter-spacing: -.01em; white-space: nowrap; }
  .registry .big em { font-style: normal; color: var(--red); }
  .registry p { margin: 0; color: var(--ink-2); max-width: 70ch; font-size: 17px; }
  .registry .track { grid-column: 1 / -1; height: 14px; background: var(--rule); position: relative; margin-top: var(--s2); }
  .registry .profile { position: absolute; inset: 0 auto 0 0; background: var(--ink-3); }
  .registry .callable { position: absolute; inset: 0 auto 0 0; background: var(--red); min-width: 4px; }

  /* ---------- bracket ---------- */
  .draft { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s6); align-items: start; }
  .bracket { background: var(--sheet); border: 2px solid var(--ink); }
  .bracket .head, .bracket .row {
    display: grid; grid-template-columns: minmax(210px, 1.6fr) repeat(3, minmax(100px, 1fr)) minmax(130px, 1fr);
  }
  .bracket .head { border-bottom: 2px solid var(--ink); }
  .bracket .head div { padding: var(--s3); font: 700 16px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .bracket .head div + div { border-left: 1px solid var(--rule); }
  .role-label { background: var(--ink); color: var(--sheet); padding: var(--s2) var(--s3); font: 800 16px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
  .row { border-bottom: 1px solid var(--rule); min-height: 72px; }
  .row:last-child { border-bottom: 0; }
  .row.out .player .name { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--red); }
  .player { padding: var(--s3); display: grid; align-content: center; gap: 4px; }
  .name { font: 800 22px/1.05 var(--display); letter-spacing: .01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px var(--s3); align-items: center; font: 500 16px/1.3 var(--text); color: var(--ink-2); }
  .tag { font: 700 14px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px 2px; border: 1px solid var(--ink-2); color: var(--ink-2); }
  .tag.third { border-color: var(--red); color: var(--red); }

  .cell { position: relative; border-left: 1px solid var(--rule); display: grid; place-items: center; padding: var(--s2) var(--s3); min-width: 0; }
  /* the bracket line: the rule itself carries advancement, the result is written on it */
  .cell.pass::before, .cell.now::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; background: var(--blue); transform-origin: left center;
  }
  .cell.now::before { background: repeating-linear-gradient(90deg, var(--blue) 0 10px, transparent 10px 18px); }
  .cell.pass.draw::before { animation: draw .55s var(--ease) both; }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .res { position: relative; background: var(--sheet); color: var(--blue); padding: 1px 8px 0; font: 800 19px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .cell.now .res { color: var(--ink-2); font-weight: 700; }
  .cell.fail { background: var(--red); color: var(--sheet); place-items: start; align-content: center; border-left-color: var(--red); }
  .cell.fail .out { font: 800 22px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }
  .cell.fail .why { font: 500 16px/1.25 var(--text); margin-top: 4px; overflow-wrap: break-word; hyphens: auto; }
  .cell.idle::after { content: ""; width: 18px; height: 2px; background: var(--rule); }
  .cell.hired { background: var(--ink); color: var(--sheet); border-left-color: var(--ink); place-items: start; align-content: center; }
  .cell.hired.killed { background: var(--red); border-left-color: var(--red); }
  .plate { font: 800 21px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }
  .plate small { display: block; margin-top: 5px; font: 700 15px/1.15 var(--display); letter-spacing: .06em; color: var(--gold); }
  .killed .plate small { color: var(--sheet); }

  /* lineup: hired agents as reversed plates */
  .lineup { display: grid; gap: var(--s4); position: sticky; top: 96px; }
  .slot { background: var(--sheet); border: 1px solid var(--ink); }
  .plate-main { background: var(--ink); color: var(--sheet); padding: var(--s3) var(--s4); border-top: 5px solid var(--gold); }
  .plate-main .name { font-size: 26px; }
  .plate-main .meta { color: var(--on-ink); }
  .plate-main .tag { border-color: #8b9099; color: var(--on-ink); }
  .plate-main code { color: var(--on-ink); }
  .plate-main.lost { background: var(--red); border-top-color: var(--ink); }
  .plate-main.lost .meta { color: var(--sheet); }
  .bench { padding: var(--s2) var(--s4) var(--s3); font: 500 16px/1.4 var(--text); color: var(--ink-2); }
  .bench b { font: 800 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); margin-right: var(--s2); }
  .sub { border-top: 1px solid var(--rule); padding: var(--s3) var(--s4); font: 500 16px/1.4 var(--text); }
  .sub .swap { display: flex; align-items: center; gap: var(--s2); font: 800 20px/1.1 var(--display); }
  .sub .swap s { color: var(--red); text-decoration-thickness: 2px; }
  .sub .time { color: var(--blue); font-weight: 600; }
  .empty-slot { padding: var(--s4); color: var(--ink-2); font: 500 16px/1.4 var(--text); }

  /* ---------- ruled tables ---------- */
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 17px; }
  th { text-align: left; font: 700 16px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); padding: var(--s2) var(--s3) var(--s3); white-space: nowrap; }
  th:first-child, td:first-child { padding-left: 0; }
  td { padding: var(--s3); border-top: 1px solid var(--rule); vertical-align: top; }
  td .id { font: 800 20px/1 var(--display); }
  td .q { display: block; margin-top: var(--s1); color: var(--ink-2); font-size: 16px; }
  tr:target td { background: var(--blue-wash); }
  .verdict { font: 800 16px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .verdict.ok { color: var(--blue); } .verdict.no { color: var(--red); } .verdict.wait { color: var(--ink-3); }
  .who { white-space: nowrap; font-weight: 600; }
  .muted { color: var(--ink-3); }

  /* baseline: two bars, same scale */
  .vs { display: grid; gap: var(--s3); }
  .vs .line { display: grid; grid-template-columns: 170px minmax(0, 1fr) 100px; gap: var(--s4); align-items: center; }
  .vs .lbl { font: 800 19px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .vs .track { height: 30px; background: var(--rule); position: relative; }
  .vs .fill { position: absolute; inset: 0 auto 0 0; background: var(--red); }
  .vs .num { font: 800 36px/1 var(--display); text-align: right; }
  .vs .line.ours .num { color: var(--blue); }
  .vs p { margin: var(--s2) 0 0; color: var(--ink-2); font-size: 16px; }

  /* empty state */
  .start { border-top: 6px solid var(--ink); background: var(--sheet); padding: var(--s6); }
  .start h1 { font: 800 clamp(34px, 4.4vw, 56px)/1 var(--display); text-transform: uppercase; margin: 0 0 var(--s3); max-width: 20ch; }
  .start p { margin: 0 0 var(--s5); color: var(--ink-2); max-width: 62ch; font-size: 19px; }
  .try { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .try button { border: 2px solid var(--ink); background: transparent; color: var(--ink); padding: var(--s2) var(--s3); border-radius: 0; font: 600 17px/1.2 var(--text); cursor: pointer; text-align: left; }
  .try button:hover { background: var(--ink); color: var(--sheet); }

  @media (max-width: 1100px) {
    .draft { grid-template-columns: 1fr; }
    .lineup { position: static; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .answer { grid-template-columns: 1fr; }
    .credits { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: var(--s4); grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  }
  @media (max-width: 760px) {
    body { font-size: 16px; }
    .bar { position: static; grid-template-columns: 1fr auto; gap: var(--s3); padding: var(--s3) var(--s4); }
    .bar form { grid-column: 1 / -1; grid-row: 2; }
    .kill { padding-left: 0; border-left: 0; }
    main { padding: var(--s5) var(--s4) var(--s7); }
    h2 { flex-direction: column; align-items: flex-start; gap: var(--s1); }
    .answer { padding: var(--s4); }
    .answer p { font-size: 18px; }
    .scoreline { font-size: 17px; }
    .scoreline span { display: block; }
    .scoreline span + span::before { content: none; }
    .registry { grid-template-columns: 1fr; }
    .bracket .head { display: none; }
    .bracket .row { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .bracket .player { grid-column: 1 / -1; padding-bottom: 0; }
    .cell { border-left: 0; border-top: 1px solid var(--rule); min-height: 64px; padding-top: 26px; }
    .cell + .cell { border-left: 1px solid var(--rule); }
    .cell::after { content: attr(data-round); position: absolute; top: 5px; left: 6px; font: 700 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
    .cell.fail::after, .cell.hired::after { color: rgba(251, 251, 248, .75); }
    .cell.idle::before { content: ""; width: 18px; height: 2px; background: var(--rule); }
    .cell.idle::after { width: auto; height: auto; background: none; }
    .res { font-size: 16px; padding: 1px 4px 0; }
    .plate { font-size: 17px; }
    .cell.fail .out { font-size: 18px; }
    .cell.fail .why { font-size: 15px; }
    /* an elimination takes two cells so its reason never splits mid-word; the next empty round gives way */
    .cell.fail { grid-column: span 2; }
    .cell.fail + .cell.idle { display: none; }
    .c-role, td code { display: none; }
    th, td { padding-left: var(--s2); padding-right: var(--s2); }
    .vs .line { grid-template-columns: 1fr auto; }
    .vs .track { grid-column: 1 / -1; grid-row: 2; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Trusted Agent Hiring</div>
  <form id="ask">
    <input type="text" id="question" aria-label="Research question" placeholder="Ask a research question" required maxlength="300" autocomplete="off">
    <button class="run" id="go" type="submit">Run</button>
  </form>
  <label class="kill">
    <input type="checkbox" id="kill">
    <span class="box" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#fbfbf8" stroke-width="2.4" stroke-linecap="square"/></svg></span>
    <span class="label">Kill main retriever <br>mid-run</span>
  </label>
</header>
<main>
  <div class="status" id="sub" role="status" aria-live="polite">Loading the latest run...</div>
  <div id="content"></div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const short = a => a && !a.startsWith('unregistered') ? `<code title="${esc(a)}">${esc(a.slice(0, 6))}…</code>` : '';
const txLink = sig => `<a href="https://explorer.solana.com/tx/${esc(sig)}?cluster=devnet" target="_blank" rel="noopener">${esc(sig.slice(0, 8))}…</a>`;
const ICON_SWAP = '<svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 7h14M10 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
const ROLES = ['retriever', 'verifier', 'writer'];
const ROUNDS = ['reputation', 'alive', 'trial'];
const ROUND_LABEL = { reputation: 'Reputation', alive: 'Alive', trial: 'Trial' };
const seen = new Map(); // cell key -> state, so only newly cleared rounds animate
let waitingFor = null;
let timer = null;

// State of one round for one candidate, from the stage it reached and its result.
function roundState(h, round) {
  const order = [...ROUNDS, 'hired'];
  const at = order.indexOf(h.stage), i = order.indexOf(round);
  if (i < at) return 'pass';
  if (i > at) return 'idle';
  if (h.result === 'failed') return 'fail';
  if (h.stage === 'hired') return 'pass';
  return 'now';
}

function playerMeta(h) {
  const rating = h.score != null ? `${h.score} avg · ${h.ratings} rating${h.ratings === 1 ? '' : 's'}` : 'no ratings yet';
  return `<span class="tag ${h.ours ? '' : 'third'}">${h.ours ? 'Ours' : 'Third-party'}</span><span>${esc(rating)}</span>${short(h.asset)}`;
}

const deadSet = r => new Set([...(r.dead ?? []), ...(r.failovers ?? []).map(f => f.from)]);

function bracket(r) {
  const head = `<div class="head"><div>Candidate</div>${ROUNDS.map(x => `<div>${ROUND_LABEL[x]}</div>`).join('')}<div>Hired</div></div>`;
  const dead = deadSet(r);
  const groups = ROLES.map(role => {
    const rows = r.hiring.filter(h => h.role === role);
    if (!rows.length) return '';
    const team = (r.team?.[role] ?? []).map(t => t.asset);
    return `<div class="role-label">${role}s</div>` + rows.map(h => {
      const cells = ROUNDS.map(round => {
        const st = roundState(h, round);
        const key = `${r.run_id}|${h.asset}|${role}|${round}`;
        const fresh = st === 'pass' && seen.get(key) !== 'pass';
        seen.set(key, st);
        const lbl = ROUND_LABEL[round];
        if (st === 'pass') {
          const res = round === 'reputation' ? (h.score != null ? String(h.score) : 'new') : round === 'alive' ? 'live' : 'pass';
          return `<div class="cell pass ${fresh ? 'draw' : ''}" data-round="${lbl}"><span class="res">${esc(res)}</span></div>`;
        }
        if (st === 'fail') return `<div class="cell fail" data-round="${lbl}"><div><div class="out">Out</div><div class="why">${esc(h.reason)}</div></div></div>`;
        if (st === 'now') return `<div class="cell now" data-round="${lbl}"><span class="res">checking</span></div>`;
        return `<div class="cell idle" data-round="${lbl}"></div>`;
      }).join('');
      const pos = team.indexOf(h.asset);
      const killed = dead.has(h.asset);
      const why = (r.failovers ?? []).find(f => f.from === h.asset);
      const subIn = (r.failovers ?? []).find(f => f.to === h.asset);
      const [plate, line] = killed ? ['Killed', why ? `${why.reason} on ${why.task_id}` : 'went offline']
        : subIn ? ['Subbed in', `took over ${subIn.task_id}`]
        : pos === 0 ? ['Starter', 'first pick'] : pos > 0 ? ['Bench', `backup ${pos}`] : ['Passed', 'awaiting the draft'];
      const hired = h.stage === 'hired'
        ? `<div class="cell hired ${killed ? 'killed' : ''}" data-round="Hired"><div class="plate">${plate}<small>${esc(line)}</small></div></div>`
        : `<div class="cell idle" data-round="Hired"></div>`;
      const out = h.result === 'failed' || killed ? 'out' : '';
      return `<div class="row ${out}"><div class="player"><div class="name">${esc(h.name)}</div><div class="meta">${playerMeta(h)}</div></div>${cells}${hired}</div>`;
    }).join('');
  }).join('');
  return `<div class="bracket">${head}${groups || '<div class="empty-slot">Searching the registry for candidates...</div>'}</div>`;
}

function lineup(r) {
  const dead = deadSet(r);
  const byAsset = Object.fromEntries(r.hiring.map(h => [h.asset, h]));
  return `<aside class="lineup" aria-label="Hired team">` + ROLES.map(role => {
    const team = r.team?.[role] ?? [];
    const subs = (r.failovers ?? []).filter(f => team.some(t => t.asset === f.from));
    if (!team.length) return `<div class="slot"><div class="role-label">${role}</div><div class="empty-slot">${r.finished_at ? 'Nobody passed' : 'Screening...'}</div></div>`;
    const live = team.find(t => !dead.has(t.asset));
    const bench = team.filter(t => t.asset !== live?.asset && !dead.has(t.asset));
    const lost = team.filter(t => dead.has(t.asset) && !subs.some(s => s.from === t.asset));
    return `<div class="slot">
      <div class="role-label">${role}</div>
      ${live
        ? `<div class="plate-main"><div class="name">${esc(live.name)}</div><div class="meta">${playerMeta(byAsset[live.asset] ?? {})}</div></div>`
        : `<div class="plate-main lost"><div class="name">No one left</div><div class="meta">${lost.map(t => esc(t.name)).join(', ')} went offline with no backup</div></div>`}
      ${subs.map(s => `<div class="sub"><div class="swap"><s>${esc(s.from_name)}</s>${ICON_SWAP}${esc(s.to_name)}</div>
        ${esc(s.reason)} on task ${esc(s.task_id)} · took over in <span class="time">${(s.took_ms / 1000).toFixed(2)} s</span></div>`).join('')}
      <div class="bench"><b>Bench</b>${bench.length ? bench.map(t => esc(t.name)).join(', ') : 'none'}</div>
    </div>`;
  }).join('') + `</aside>`;
}

function phase(r) {
  if (r.finished_at) return null;
  if (!ROLES.every(role => r.team?.[role])) return 'Hiring';
  if (r.claims.some(c => c.status === 'pending')) return r.claims.every(c => c.status === 'pending') ? 'Retrieving' : 'Verifying';
  if (!r.answer) return 'Writing';
  return 'Recording feedback';
}

function registry(r, compact) {
  const g = r.registry;
  if (!g) return '';
  // While a run is live the bracket owns the viewport, so the registry shrinks to one line.
  if (compact) return `<div class="registry compact" style="margin-top:var(--s4)">
      <div class="big"><em>${g.with_endpoint}</em> of ${g.total.toLocaleString()} callable</div>
      <div class="track" role="img" aria-label="${g.with_endpoint} of ${g.total} registry agents callable">
        <span class="profile" style="width:${100 * g.with_profile / g.total}%"></span>
        <span class="callable" style="width:${100 * g.with_endpoint / g.total}%"></span>
      </div>
    </div>`;
  return `<h2>The open registry<small>Solana devnet, read live at the start of this run</small></h2>
    <div class="registry">
      <div class="big"><em>${g.with_endpoint}</em> of ${g.total.toLocaleString()}</div>
      <p>registered agents have an endpoint you can call at all (${(100 * g.with_endpoint / g.total).toFixed(1)}%). ${g.with_profile.toLocaleString()} have a readable profile and ${g.with_skills} declare any skills. That is why every candidate is screened before it is hired.</p>
      <div class="track" role="img" aria-label="${g.with_endpoint} of ${g.total} agents callable">
        <span class="profile" style="width:${100 * g.with_profile / g.total}%"></span>
        <span class="callable" style="width:${100 * g.with_endpoint / g.total}%"></span>
      </div>
    </div>`;
}

function answer(r) {
  if (r.error) return `<div class="answer stopped"><p>${esc(r.answer ?? r.error)}</p></div>`;
  if (!r.answer) return `<div class="answer waiting"><p>The answer appears here once the hired team has retrieved and verified its claims.</p></div>`;
  const names = list => [...new Set(list.filter(Boolean))].map(esc).join(', ') || '—';
  return `<div class="answer">
      <p>${esc(r.answer).replace(/\s*\[(c\d+)\]/g, ' <a class="cite" href="#$1">$1</a>')}</p>
      <dl class="credits">
        <div><dt>Retrieved by</dt><dd>${names(r.claims.map(c => c.produced_by_name))}</dd></div>
        <div><dt>Checked by</dt><dd>${names(r.claims.map(c => c.verified_by_name))}</dd></div>
        <div><dt>Written by</dt><dd>${names([r.written_by_name])}</dd></div>
      </dl>
    </div>`;
}

function scoreline(r) {
  const m = r.metrics || {};
  const parts = [
    `<b>${m.claims_supported ?? 0}/${m.claims ?? 0}</b> claims supported`,
    `<b>${esc(m.bad_agents_rejected ?? '-')}</b> bad agents out`,
    `<b>${m.third_party_passed ?? 0}/${m.third_party_tried ?? 0}</b> third-party passed`,
    m.failover_ms != null ? `<b>${(m.failover_ms / 1000).toFixed(2)} s</b> takeover` : null,
    `<b>${esc(m.feedback_written ?? '-')}</b> on-chain`,
  ].filter(Boolean);
  return `<p class="scoreline">${parts.map(p => `<span>${p}</span>`).join('')}</p>`;
}

async function load() {
  clearTimeout(timer);
  const { running } = await fetch('/api/status', { cache: 'no-store' }).then(x => x.json()).catch(() => ({ running: false }));
  const go = document.getElementById('go');
  go.disabled = running;
  go.textContent = running ? 'Running' : 'Run';
  const res = await fetch('/runs/latest.json', { cache: 'no-store' });
  const r = res.ok ? await res.json() : null;
  if (r && waitingFor && r.run_id !== waitingFor) waitingFor = null;
  if (running || waitingFor || (r && !r.finished_at)) timer = setTimeout(load, 1200);
  const sub = document.getElementById('sub');
  if (waitingFor) { sub.innerHTML = '<span class="phase">Starting</span> Planning the question and reading the registry...'; return; }
  if (!r) { sub.textContent = ''; document.getElementById('content').innerHTML = emptyState(); return; }

  const now = phase(r);
  sub.innerHTML = (now ? `<span class="phase">${now}</span>` : '<b>Finished</b>') +
    ` <span>${r.finished_at ? new Date(r.finished_at).toLocaleString() : 'started ' + new Date(r.started_at).toLocaleTimeString()}</span>` +
    ` <span>${esc(r.mode ?? '')}</span> <code>${esc(r.run_id)}</code>`;

  const draft = `<h2>Hiring<small>Each candidate holds its row; the blue line carries it through every round it clears.</small></h2>
    <div class="draft">${bracket(r)}${lineup(r)}</div>`;

  // One dominant element per state: the bracket while hiring, the answer once the run ends.
  let html = `<h1 class="question ${r.finished_at ? '' : 'live'}">${esc(r.question)}</h1>`;
  html += r.finished_at
    ? answer(r) + scoreline(r) + registry(r) + draft
    : registry(r, true) + draft + `<h2>Answer</h2>` + answer(r);

  if (r.claims.length) html += `<h2>Claims<small>Each one traced to its source, the agent that made it and the agent that checked it</small></h2>` +
    `<div class="wrap"><table><thead><tr><th>ID</th><th>Claim and exact quote</th><th>Source</th><th>Made by</th><th>Checked by</th><th>Verdict</th></tr></thead><tbody>` +
    r.claims.map(c => `<tr id="${esc(c.id)}"><td><span class="id">${esc(c.id)}</span></td>
      <td>${esc(c.text)}${c.quote && c.quote !== c.text ? `<span class="q">“${esc(c.quote)}”</span>` : ''}</td>
      <td><a href="${esc(c.source_url)}" target="_blank" rel="noopener">${esc(decodeURIComponent((c.source_url ?? '').split('/wiki/')[1] ?? 'source').replace(/_/g, ' '))}</a></td>
      <td class="who">${esc(c.produced_by_name)}</td><td class="who">${esc(c.verified_by_name ?? '...')}</td>
      <td><span class="verdict ${c.status === 'supported' ? 'ok' : c.status === 'pending' ? 'wait' : 'no'}" title="${esc(c.reason)}">${esc(c.status)}</span></td></tr>`).join('') +
    `</tbody></table></div>`;

  if (r.feedback.length) html += `<h2>On-chain feedback<small>Written to the Solana Agent Registry by the orchestrator's wallet</small></h2>` +
    `<div class="wrap"><table><thead><tr><th>Agent</th><th class="c-role">Role</th><th>Score</th><th>Outcome</th><th>Transaction</th></tr></thead><tbody>` +
    r.feedback.map(f => `<tr><td class="who">${esc(f.name)} ${short(f.asset)}</td><td class="c-role">${esc(f.role)}</td><td><b>${f.score}</b></td>
      <td><span class="verdict ${f.outcome === 'passed' ? 'ok' : 'no'}">${esc(f.outcome)}</span></td>
      <td>${f.tx ? txLink(f.tx) : `<span class="muted">${esc(f.error ?? 'not sent')}</span>`}</td></tr>`).join('') +
    `</tbody></table></div>`;

  const compare = await fetch('/runs/compare.json', { cache: 'no-store' }).then(x => x.ok ? x.json() : null).catch(() => null);
  if (compare) {
    const s = compare.summary, max = Math.max(s.baseline_unsupported_pct, s.ours_unsupported_pct, 1);
    html += `<h2>Fixed team vs ours<small>Unsupported claims in the final answer, ${compare.rows.length} questions</small></h2>
      <div class="vs">
        <div class="line"><span class="lbl">Fixed team</span><span class="track"><span class="fill" style="width:${100 * s.baseline_unsupported_pct / max}%"></span></span><span class="num">${s.baseline_unsupported_pct}%</span></div>
        <div class="line ours"><span class="lbl">Ours</span><span class="track"><span class="fill" style="width:${100 * s.ours_unsupported_pct / max}%"></span></span><span class="num">${s.ours_unsupported_pct}%</span></div>
        <p>The fixed team includes one bad agent and checks nothing. Same questions, same agents, same grading.</p>
      </div>`;
  }
  document.getElementById('content').innerHTML = html;
}

function emptyState() {
  const qs = ['How was penicillin discovered and why did it matter?', 'What causes coral bleaching and where has it happened?', 'How do vaccines train the immune system?'];
  return `<section class="start"><h1>Hire a research team from the open registry</h1>
    <p>Every candidate is screened on its on-chain reputation, whether it is alive, and a known-answer trial. Only survivors are hired, and every agent's score goes back on-chain.</p>
    <div class="try">${qs.map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div></section>`;
}

document.getElementById('content').addEventListener('click', e => {
  const q = e.target.closest('[data-q]')?.dataset.q;
  if (q) { const input = document.getElementById('question'); input.value = q; input.focus(); }
});

document.getElementById('ask').addEventListener('submit', async e => {
  e.preventDefault();
  const question = document.getElementById('question').value.trim();
  if (!question) return;
  const current = await fetch('/runs/latest.json', { cache: 'no-store' }).then(x => x.ok ? x.json() : null).catch(() => null);
  const res = await fetch('/api/run', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ question, kill: document.getElementById('kill').checked }),
  });
  if (!res.ok) {
    document.getElementById('sub').textContent = (await res.json().catch(() => ({}))).error ?? `Could not start the run (HTTP ${res.status}). Is the agent server running?`;
    return;
  }
  waitingFor = current?.run_id ?? 'none';
  document.getElementById('content').innerHTML = '';
  load();
});
load();
</script>
</body>
</html>
